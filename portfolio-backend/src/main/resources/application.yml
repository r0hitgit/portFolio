spring:
  application:
    name: portfolio-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-env-vars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  contact:
    notify-email: ${CONTACT_NOTIFY_EMAIL:r0hiitverma1095@gmail.com}
  brevo:
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:no-reply@rohitverma.dev}
    sender-name: ${BREVO_SENDER_NAME:Rohit Verma Portfolio}
